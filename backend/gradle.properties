# Gợi ý nơi tìm JDK 25 cho máy dev cài Java qua apt (Ubuntu/Debian).
# Đường dẫn không tồn tại sẽ được bỏ qua — Docker/CI dùng JDK của môi trường,
# hoặc Gradle tự tải qua foojay resolver khai báo trong settings.gradle.kts.
org.gradle.java.installations.paths=/usr/lib/jvm/java-25-openjdk-amd64
org.gradle.caching=true
