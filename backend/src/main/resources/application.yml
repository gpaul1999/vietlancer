spring:
  application:
    name: vietlancer
  # Java 25: virtual threads cho mỗi request → chịu tải đồng thời cao mà không tốn thread pool
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:h2:file:./data/vietlancer;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    # OSIV bật để controller đọc được lazy relations khi map DTO (đơn giản cho MVP)
    open-in-view: true
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080
  shutdown: graceful

# Monitoring: chỉ mở /actuator/health (cho uptime check + docker healthcheck),
# KHÔNG mở env/beans/metrics ra ngoài. Chi tiết health chỉ hiện với người đã đăng nhập.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

app:
  jwt:
    # Đổi bằng biến môi trường APP_JWT_SECRET ở môi trường thật
    secret: ${APP_JWT_SECRET:vietlancer-dev-secret-key-change-me-in-production-0123456789}
    expiration-ms: 86400000 # 24h
  ai:
    # local  = classifier miễn phí chạy tại chỗ (mặc định)
    # claude = Claude API (cần ANTHROPIC_API_KEY), tự fallback về local nếu lỗi
    classifier: ${APP_AI_CLASSIFIER:local}
    claude-model: claude-sonnet-5
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
  platform:
    fee-percent: 10
    free-bids-per-month: 15
    client-premium-price: 99000
    freelancer-premium-price: 79000
  cors:
    allowed-origins: ${APP_CORS_ORIGINS:http://localhost:3000}
  storage:
    dir: ${APP_STORAGE_DIR:./uploads}
  # Link trong email + địa chỉ người gửi
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  mail:
    from: ${APP_MAIL_FROM:no-reply@vietlancer.vn}
  # Mật khẩu admin: dev có default để tiện demo; PRODUCTION BẮT BUỘC đặt APP_ADMIN_PASSWORD
  admin:
    password: ${APP_ADMIN_PASSWORD:password123}
  seed-demo: ${APP_SEED_DEMO:true}
  rate-limit:
    # Chỉ bật khi đứng sau reverse proxy tin cậy có ghi đè X-Forwarded-For
    trust-forwarded-header: ${APP_TRUST_FORWARDED_HEADER:false}

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vietlancer}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USER:vietlancer}
    password: ${DB_PASSWORD:vietlancer}
  h2:
    console:
      enabled: false

# Đứng sau nginx: đọc X-Forwarded-Proto/Host để URL file sinh ra đúng https + domain thật
server:
  forward-headers-strategy: framework

app:
  # Production: không seed demo, admin password bắt buộc từ env (trống → không tạo admin)
  seed-demo: ${APP_SEED_DEMO:false}
  admin:
    password: ${APP_ADMIN_PASSWORD:}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
