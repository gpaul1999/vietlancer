# Cấu hình HTTP (dùng ngay khi mới deploy, CHƯA có SSL).
# Sau khi lấy được chứng chỉ Let's Encrypt, thay bằng nginx-ssl.conf.example (xem DEPLOY.md).

upstream backend_upstream {
    server backend:8080;
}

upstream frontend_upstream {
    server frontend:3000;
}

server {
    listen 80;
    server_name _;

    # Upload tối đa 5MB (khớp giới hạn backend) + chút overhead multipart
    client_max_body_size 6M;

    # Cho certbot xác thực domain khi xin chứng chỉ
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # WebSocket chat real-time
    location /ws {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # API + file đã upload + health check → backend
    location ~ ^/(api|files|actuator/health) {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Còn lại → Next.js
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
